# cargo-deny configuration. Runs in CI (see .github/workflows/ci.yml).
# The goal is supply-chain hygiene: no known vulnerabilities, no unexpected
# licenses, no duplicate/yanked crates slipping into the hot path.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. A copyleft dependency in the engine binary would be
# a legal problem for a proprietary trading system, so we fail the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
